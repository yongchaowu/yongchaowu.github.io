name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"
      - name: Verify generated tag pages
        run: uv run --with-requirements scripts/requirements.txt scripts/generate_tag_pages.py --check
      - name: Build with Jekyll
        run: |
          bundle exec jekyll clean
          bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
          TZ: UTC
      - name: Validate curated source links
        run: ruby scripts/validate-curation.rb
      - name: Validate tag catalog
        run: ruby scripts/validate-tags.rb
      - name: Run site smoke tests
        run: ruby scripts/smoke-test.rb
      - name: Check JavaScript syntax
        run: |
          node --check js/search.js
          node --check js/pageContent.js
          node --check js/tags.js
          node --check js/toc.js
          node --check js/main.js
          node --check js/copy-code.js
      - name: Verify historical post blobs
        run: ruby scripts/verify-post-history.rb
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
