  - post: _posts/2023-04-06-OS-Linux-Tool-可视化比较与合并工具Meld.md
    fixed_blob: c9855ba61a90295ea659c27682b41c249edb7af8
    date: 2026-10-01
    kind: mixed-content-image
    # Re-applied by scripts/sync_upstream.py after every upstream sync. Without
    # this the sync silently undoes the correction: cnblogs still carries http://
    # URLs, so a wholesale copy reinstates active mixed content and smoke-test.rb
    # fails on the three images. Keeping the rewrite next to its reason is what
    # makes a recorded fix survive re-sync instead of being rediscovered each time.
    rewrite: http://meldmerge.org/images/ -> https://meldmerge.org/images/
    reapply:
      - http://meldmerge.org/images/vcview.png
      - http://meldmerge.org/images/filediff.png
      - http://meldmerge.org/images/dirdiff.png
    reason: Upgrade three screenshot URLs from http:// to https://. The site is served over HTTPS, so browsers classify these as active mixed content and block them silently -- the three images were not rendering at all. The https:// equivalents were verified to return 200 with image/png on 2026-10-01. Only the three image URLs changed; the two plain-text http:// links to the same host were left as they are not a rendering defect.

# --- 2026-10-01 upstream sync: text defects carried in from cnblogs ---
  - post: _posts/2023-02-27-Tool-Git.md
    fixed_blob: 17ef35f20c105c1843ab7c0172cee1699d26a366
    date: 2026-10-01
    kind: empty-link-target
    auto: upstream_text.repair_broken_links / encode_link_target_whitespace
    # No `rewrite` rule on purpose. Unlike the meldmerge https upgrade, these repairs are
    # derived from the text itself, so scripts/upstream_text.py re-derives them on every sync
    # and compare_upstream.py recognises them as applied. A `rewrite` here would be a second,
    # hand-maintained copy of logic that already works.
    reason: >-
      Upstream carries three links shaped `label[https://host/path]()`. The URL is present in the text but was never given a target, so kramdown rendered `<a href="">https://host/path</a>` and the link went nowhere. Each is promoted to an autolink (`<https://host/path>`), which restores a working link and changes no wording. Introduced by the 2026-10-01 upstream sync carrying the 2026-09-25 proofread; the post had zero occurrences before it. smoke-test.rb rejects empty anchors and site-review.py rejects empty anchor href, so this was a rendering defect rather than a preference.

# --- 2026-10-01: section upstream dropped, restored deliberately ---
  - post: _posts/2026-06-12-Python-Ray-Offline-Installation-Guide.md
    fixed_blob: 7ae649ba4e075ac0b804e1f81237cce9a7fb583e
    date: 2026-10-01
    kind: missing-upstream-section
    # No `rewrite` rule: this is not a substitution but the re-insertion of a whole
    # section that upstream removed, so there is no find-and-replace to record. The
    # reason field is what tells the next person it was deliberate.
    reason: >-
      Upstream's rewrite dropped this repository's closing "Next Steps" section, which
      carries two `{% post_url %}` cross-references into the vLLM+Ray and the serving-architecture
      guides. Sync cannot re-anchor a link whose target text no longer exists upstream, so
      upstream_text.py reports it as `upstream_dropped` rather than as a lost facility, and the
      section is restored here by hand. Both sides' value is kept: upstream's Ray 2.40.0 version
      constraint, which this repository lacked, and these two navigation links, which upstream
      no longer has. Re-apply by hand after any future sync -- a mechanical rule cannot tell an
      upstream deletion worth keeping from one worth reverting.
