<div class="post-recent">
    <div class="pre">
        {% if page.previous %}
        <p><strong>← Previous</strong> <a href="{{ page.previous.url | prepend: site.baseurl }}">{{ page.previous.display_title | default: page.previous.title }}</a></p>
        {% endif %}
    </div>
    <div class="nex">

        {% if page.next %}
        <p><strong>Next →</strong> <a href="{{ page.next.url | prepend: site.baseurl }}">{{ page.next.display_title | default: page.next.title }}</a></p>
        {% endif %}
    </div>
</div>
