{% if page.tested %}
<div class="post-tested">
    <div class="post-tested-title">{% include icon.html name="flask" %} Tested environment</div>
    <dl>
        {% for item in page.tested %}
        <div class="post-tested-row">
            <dt>{{ item[0] }}</dt>
            <dd>{{ item[1] }}</dd>
        </div>
        {% endfor %}
    </dl>
    <div class="post-tested-note">Verified on this environment.</div>
</div>
{% endif %}
