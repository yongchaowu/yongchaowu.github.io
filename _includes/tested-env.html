{% if page.tested_env %}
<div class="tested-env">
    <div class="tested-env-header"><i class="fa fa-flask"></i> Test Environment</div>
    <table>
        {% for item in page.tested_env %}
        <tr><td class="te-key">{{ item.first }}</td><td class="te-val">{{ item.last }}</td></tr>
        {% endfor %}
    </table>
</div>
{% endif %}
