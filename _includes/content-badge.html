{% if page.content_origin %}
<span class="content-badge content-badge--{{ page.content_origin }}">
  {% if page.content_origin == 'ai-assisted' %}
    <i class="fa fa-magic"></i> AI-assisted
  {% elsif page.content_origin == 'imported' %}
    <i class="fa fa-archive"></i> Imported
  {% endif %}
</span>
{% endif %}
