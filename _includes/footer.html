<footer class="site-footer">


    <div class="wrapper">

        <p class="description">
            C++ Backend · AI Agent / LLM
        </p>
        <p class="contact">
            {% if site.github_username %}<a href="https://github.com/{{site.github_username}}" title="GitHub"><i class="fa fa-github" aria-hidden="true"></i></a>{% endif %}
            {% if site.email %}<a href="mailto:{{site.email}}" title="email"><i class="fa fa-envelope-o" aria-hidden="true"></i></a>{% endif %}
            {% if site.weibo_username %}<a href="https://weibo.com/{{site.weibo_username}}" title="Weibo"><i class="fa fa-weibo" aria-hidden="true"></i></a>{% endif %}
        </p>
        <p class="power">
            © 2018–{{ site.time | date: "%Y" }} {{ site.title }} · Built with <a href="https://jekyllrb.com/">Jekyll</a> · Hosted on <a href="https://pages.github.com/">GitHub Pages</a>
        </p>
    </div>
</footer>
