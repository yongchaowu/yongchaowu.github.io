---
layout: default
---

<main class="page clearfix" post id="main-content" tabindex="-1">
    <div class="left">
        <h1>{{ page.display_title | default: page.title }}</h1>
        <hr>
        {{content}}
    </div>
    <button class="anchor">{% include icon.html name="anchor" %}</button>
    <div class="right">
        <div class="wrap">

            <!-- Content -->
            <div class="side content">
                <div>
                    Content
                </div>
                <ul id="content-side" class="content-ul">
                </ul>
            </div>
            <!-- 其他div框放到这里 -->
            <!-- <div class="side">bbbb</div> -->
        </div>
    </div>
</main>
<script src="{{ '/js/pageContent.js' | relative_url }}" charset="utf-8"></script>
